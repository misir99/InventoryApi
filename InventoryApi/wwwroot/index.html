<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8" />
    <title>Inventory</title>
</head>
<body>
    <h1>Proizvodi</h1>
    <p id="poruka"></p>

    <h2>Novi proizvod</h2>
    <div>
        <input id="naziv" placeholder="Naziv" />
        <input id="cijena" type="number" step="0.01" placeholder="Cijena" />
        <input id="kategorija" placeholder="Kategorija" />
        <input id="kolicina" type="number" placeholder="Količina" />
        <button onclick="dodajProizvod()">Dodaj</button>
    </div>

    <br />

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>Id</th>
                <th>Naziv</th>
                <th>Cijena</th>
                <th>Kategorija</th>
                <th>Količina</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tijelo"></tbody>
    </table>

    <script>
        async function ucitajProizvode() {
            const poruka = document.getElementById("poruka");
            const tijelo = document.getElementById("tijelo");

            try {
                const odgovor = await fetch("/api/products");
                if (!odgovor.ok) {
                    poruka.textContent = "Greška: " + odgovor.status;
                    return;
                }

                const proizvodi = await odgovor.json();
                tijelo.innerHTML = "";

                for (const p of proizvodi) {
                    const red = document.createElement("tr");
                    red.innerHTML = `
                            <td>${p.id}</td>
                            <td>${p.name}</td>
                            <td>${p.price.toFixed(2)} KM</td>
                            <td>${p.category}</td>
                            <td>${p.quantity}</td>
                            <td><button onclick="obrisiProizvod(${p.id})">Obriši</button></td>`;
                    tijelo.appendChild(red);
                }

                poruka.textContent = proizvodi.length === 0 ? "Nema proizvoda." : "";
            } catch (err) {
                poruka.textContent = "Ne mogu doći do API-ja.";
            }
        }

        async function dodajProizvod() {
            const poruka = document.getElementById("poruka");

            const proizvod = {
                name: document.getElementById("naziv").value,
                price: parseFloat(document.getElementById("cijena").value),
                category: document.getElementById("kategorija").value,
                quantity: parseInt(document.getElementById("kolicina").value)
            };

            const odgovor = await fetch("/api/products", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(proizvod)
            });

            if (!odgovor.ok) {
                poruka.textContent = "Greška pri dodavanju: " + odgovor.status;
                return;
            }

            document.getElementById("naziv").value = "";
            document.getElementById("cijena").value = "";
            document.getElementById("kategorija").value = "";
            document.getElementById("kolicina").value = "";
            ucitajProizvode();
        }

        async function obrisiProizvod(id) {
            if (!confirm("Obrisati proizvod?")) return;

            const odgovor = await fetch("/api/products/" + id, { method: "DELETE" });

            if (!odgovor.ok) {
                document.getElementById("poruka").textContent = "Greška pri brisanju: " + odgovor.status;
                return;
            }
            ucitajProizvode();
        }

        ucitajProizvode();
    </script>
</body>
</html>
